<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: relative;
        }

        /* Animated background particles */
        .background-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 14s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; animation-duration: 16s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1s; animation-duration: 18s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 3s; animation-duration: 13s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; animation-duration: 15s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 2s; animation-duration: 17s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 4s; animation-duration: 19s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 1s; animation-duration: 14s; }
        .particle:nth-child(10) { left: 15%; animation-delay: 3s; animation-duration: 16s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main container */
        .error-container {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 404 Number */
        .error-code {
            font-size: clamp(80px, 20vw, 200px);
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(255, 255, 255, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Emoji decoration */
        .error-emoji {
            font-size: clamp(60px, 15vw, 120px);
            margin: 1rem 0;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        /* Title */
        .error-title {
            font-size: clamp(24px, 5vw, 48px);
            font-weight: 700;
            margin: 1.5rem 0 1rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        /* Description */
        .error-description {
            font-size: clamp(16px, 3vw, 20px);
            line-height: 1.6;
            margin: 1rem 0 2rem;
            opacity: 0.95;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            min-width: 140px;
        }

        .btn-primary {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
            background: #f8f9fa;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Quick links section */
        .quick-links {
            margin-top: 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .quick-links h3 {
            font-size: clamp(18px, 4vw, 24px);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .quick-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: clamp(14px, 2vw, 16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .quick-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Floating decorative elements */
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .floating-emoji {
            position: absolute;
            font-size: 40px;
            opacity: 0.3;
            animation: floatEmoji 8s ease-in-out infinite;
        }

        .floating-emoji:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-emoji:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .floating-emoji:nth-child(3) {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
        }

        .floating-emoji:nth-child(4) {
            bottom: 20%;
            right: 10%;
            animation-delay: 1.5s;
        }

        @keyframes floatEmoji {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .error-container {
                padding: 1.5rem;
            }

            .quick-links {
                padding: 1.5rem;
            }

            .links-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
                gap: 0.75rem;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }

            .floating-emoji {
                font-size: 30px;
            }
        }

        @media (max-width: 480px) {
            .error-container {
                padding: 1rem;
            }

            .quick-links {
                margin-top: 2rem;
                padding: 1rem;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            body {
                background: linear-gradient(135deg, #0066cc 0%, #4c2882 100%);
            }

            .btn-primary {
                border: 3px solid #667eea;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Background animation -->
    <div class="background-animation">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Floating decorative elements -->
    <div class="floating-elements">
        <div class="floating-emoji">🔍</div>
        <div class="floating-emoji">📚</div>
        <div class="floating-emoji">🎯</div>
        <div class="floating-emoji">💡</div>
    </div>

    <!-- Main error container -->
    <div class="error-container">
        <div class="error-emoji">😵</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Oops! Page Not Found</h2>
        <p class="error-description">
            The page you're looking for seems to have vanished into thin air!
            Don't worry, you can still find your way back home or explore our quiz collection.
        </p>

        <div class="button-group">
            <a href="/" class="btn btn-primary">
                <span>🏠</span>
                <span>Go Home</span>
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <span>←</span>
                <span>Go Back</span>
            </a>
        </div>

        <div class="quick-links">
            <h3>🎯 Try These Instead:</h3>
            <div class="links-grid">
                <a href="/#quiz-science" class="quick-link">
                    <span>🔬</span>
                    <span>Science Quiz</span>
                </a>
                <a href="/#quiz-math" class="quick-link">
                    <span>🔢</span>
                    <span>Math Quiz</span>
                </a>
                <a href="/#quiz-history" class="quick-link">
                    <span>📜</span>
                    <span>History Quiz</span>
                </a>
                <a href="/#quiz-geography" class="quick-link">
                    <span>🌍</span>
                    <span>Geography Quiz</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
