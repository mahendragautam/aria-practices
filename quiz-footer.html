<!-- Quiz Master Footer - Paste this in WPCode as HTML snippet, set to run in Footer -->
<style>
/* FOOTER DESIGN - Full Width */
.quiz-footer {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 40px 20px 25px;
  text-align: center;
  margin: 0 !important;
  margin-left: calc(-50vw + 50%) !important;
  margin-right: calc(-50vw + 50%) !important;
  width: 100vw !important;
  max-width: 100vw !important;
  box-sizing: border-box;
  overflow: hidden;
}

.quiz-footer::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(255,255,255,0.3);
}

.footer-content {
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.footer-logo {
  font-size: 2em;
  margin-bottom: 15px;
}

.footer-logo a {
  color: white;
  text-decoration: none !important; /* ✅ Underline removed */
  opacity: 0.95;
  transition: all 0.3s;
}

.footer-logo a:hover {
  opacity: 1;
  transform: translateY(-2px);
}

.footer-tagline {
  font-size: 1em;
  opacity: 0.9;
  margin-bottom: 20px;
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin: 20px 0;
  flex-wrap: wrap;
}

.footer-link {
  color: white;
  text-decoration: none;
  opacity: 0.9;
  transition: all 0.3s;
  font-size: 0.95em;
}

.footer-link:hover {
  opacity: 1;
  transform: translateY(-2px);
}

.footer-social {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 25px 0;
  font-size: 1.8em;
}

.footer-social a {
  color: white;
  transition: all 0.3s;
  opacity: 0.9;
}

.footer-social a:hover {
  transform: scale(1.2);
  opacity: 1;
}

.footer-copyright {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.2);
  font-size: 0.9em;
  opacity: 0.8;
}

/* Responsive small tweak */
@media (max-width:480px) {
  .footer-logo {
    font-size: 1.6em;
  }
  .footer-social {
    font-size: 1.5em;
    gap: 12px;
  }
  .footer-links {
    gap: 12px;
    font-size: 0.9em;
  }
}
</style>

<footer class="quiz-footer" role="contentinfo">
  <div class="footer-content">
    <div class="footer-logo" aria-hidden="true">
      <a href="https://quiz.smartfamilypicks.com/" rel="noopener noreferrer">🎯Quiz.SmartFamilyPicks.com</a>
    </div>
    <p class="footer-tagline">Learn, Challenge, Excel!</p>

    <nav class="footer-links" aria-label="Footer">
      <a href="#about" class="footer-link">About</a>
      <a href="#contact" class="footer-link">Contact</a>
      <a href="#privacy" class="footer-link">Privacy Policy</a>
      <a href="#terms" class="footer-link">Terms of Service</a>
    </nav>

    <div class="footer-social" aria-label="Social media links">
      <a href="#facebook" title="Facebook" aria-label="Facebook">📘</a>
      <a href="#twitter" title="Twitter" aria-label="Twitter">🐦</a>
      <a href="#instagram" title="Instagram" aria-label="Instagram">📷</a>
      <a href="#linkedin" title="LinkedIn" aria-label="LinkedIn">💼</a>
    </div>

    <div class="footer-copyright">
      © <span id="qm-year"></span> Quiz Master. All rights reserved.<br>
      Made with <span aria-hidden="true">❤</span> for learners worldwide
    </div>
  </div>
</footer>

<script>
(function(){
  var el = document.getElementById('qm-year');
  if (el) el.textContent = new Date().getFullYear();
})();
</script>
