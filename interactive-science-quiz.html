<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Science Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fff;
            overflow-x: hidden;
        }

        .main-container {
            width: 100vw;
            min-height: 100vh;
            background: transparent;
            position: relative;
        }

        .chapter-selection, .level-selection, .quiz-container, .result-container {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            display: none;
        }

        .chapter-selection.active, .level-selection.active, .quiz-container.active, .result-container.active {
            display: block;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .chapter-card {
            padding: 40px 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            color: #000;
            font-weight: bold;
            font-size: 1.2em;
        }

        .chapter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 60px auto;
        }

        .level-card {
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
            color: #fff;
            font-weight: bold;
            font-size: 1.1em;
        }

        .level-card:hover {
            transform: scale(1.05);
        }

        .level-easy { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .level-medium { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .level-hard { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .level-expert { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .level-extreme { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            z-index: 100;
        }

        .back-button:hover {
            background: #5568d3;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .progress-info {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            max-width: 600px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            border-radius: 10px;
        }

        .topic-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: white;
        }

        .topic-biology { background: #2ecc71; }
        .topic-physics { background: #3498db; }
        .topic-chemistry { background: #e74c3c; }
        .topic-astronomy { background: #9b59b6; }

        .question-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .question-emoji {
            font-size: 3em;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .question-text {
            font-size: 1.5em;
            color: #333;
            margin: 20px 0;
            font-weight: 600;
        }

        .answers-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .answer-option {
            padding: 20px;
            background: #f8f9fa;
            border: 3px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
            text-align: justify;
        }

        .answer-option:hover {
            background: #e9ecef;
            transform: translateY(-3px);
        }

        .answer-option.selected {
            border-color: #667eea;
            background: #e8eaf6;
        }

        .answer-option.correct {
            border-color: #2ecc71;
            background: #d4edda;
        }

        .answer-option.incorrect {
            border-color: #e74c3c;
            background: #f8d7da;
        }

        .feedback-message {
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            margin: 20px 0;
            min-height: 40px;
        }

        .feedback-correct { color: #2ecc71; }
        .feedback-incorrect { color: #e74c3c; }

        .next-button {
            display: block;
            margin: 30px auto;
            padding: 15px 50px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            cursor: pointer;
            font-weight: bold;
        }

        .next-button:hover {
            background: #5568d3;
        }

        .next-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .extreme-input {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            font-size: 1.1em;
            border: 3px solid #667eea;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
        }

        .show-answer-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
        }

        .extreme-answer {
            display: none;
            padding: 20px;
            background: #fff3cd;
            border: 2px solid #f39c12;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
            text-align: justify;
        }

        .falling-emoji {
            position: fixed;
            left: 0;
            font-size: 2em;
            pointer-events: none;
            z-index: 1000;
            animation: fall linear;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .result-content {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .result-title {
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #333;
        }

        .score-display {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .badge {
            font-size: 5em;
            margin: 30px 0;
        }

        .badge-text {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
        }

        .result-details {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            text-align: left;
        }

        .result-details div {
            font-size: 1.3em;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
        }

        .restart-button {
            padding: 15px 50px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
        }

        .restart-button:hover {
            background: #5568d3;
        }

        .celebration-emoji {
            position: fixed;
            font-size: 3em;
            animation: celebrate 3s ease-out forwards;
            pointer-events: none;
            z-index: 2000;
        }

        @keyframes celebrate {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }

        .floating-bg-emoji {
            position: fixed;
            font-size: 3em;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(100px, -100px) rotate(120deg);
            }
            66% {
                transform: translate(-100px, 100px) rotate(240deg);
            }
        }

        .title {
            text-align: center;
            font-size: 2.5em;
            color: #333;
            margin: 20px 0 40px 0;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .question-emoji {
                font-size: 2em;
            }

            .question-text {
                font-size: 1.2em;
            }

            .answers-container {
                grid-template-columns: 1fr;
            }

            .answer-option {
                text-align: left;
            }

            .chapter-grid {
                grid-template-columns: 1fr;
            }

            .level-grid {
                grid-template-columns: 1fr;
            }

            .falling-emoji {
                display: none;
            }

            .progress-bar {
                height: 6px;
            }

            .question-emoji {
                font-size: 1.5em;
            }
        }

        .emoji-container {
            display: inline-block;
        }

        .level-title {
            text-align: center;
            font-size: 2em;
            margin: 40px 0 20px 0;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Chapter Selection -->
        <div class="chapter-selection active">
            <h1 class="title">🔬 Interactive Science Quiz 🔬</h1>
            <div class="chapter-grid" id="chapterGrid"></div>
        </div>

        <!-- Level Selection -->
        <div class="level-selection">
            <button class="back-button" onclick="showChapterSelection()">← Back</button>
            <h2 class="level-title" id="levelTitle">Select Difficulty Level</h2>
            <div class="level-grid">
                <div class="level-card level-easy" onclick="startQuiz('easy')">
                    <div>🟢 EASY</div>
                    <div style="font-size: 0.9em; margin-top: 10px;">True or False</div>
                </div>
                <div class="level-card level-medium" onclick="startQuiz('medium')">
                    <div>🟡 MEDIUM</div>
                    <div style="font-size: 0.9em; margin-top: 10px;">2 Options</div>
                </div>
                <div class="level-card level-hard" onclick="startQuiz('hard')">
                    <div>🟠 HARD</div>
                    <div style="font-size: 0.9em; margin-top: 10px;">3 Options</div>
                </div>
                <div class="level-card level-expert" onclick="startQuiz('expert')">
                    <div>🔴 EXPERT</div>
                    <div style="font-size: 0.9em; margin-top: 10px;">4 Options</div>
                </div>
                <div class="level-card level-extreme" onclick="startQuiz('extreme')">
                    <div>⚫ EXTREME</div>
                    <div style="font-size: 0.9em; margin-top: 10px;">Text Answer</div>
                </div>
            </div>
        </div>

        <!-- Quiz Container -->
        <div class="quiz-container">
            <button class="back-button" onclick="showLevelSelection()">← Back</button>
            <div class="quiz-header">
                <div class="progress-info" id="progressInfo">0/10</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div id="quizContent"></div>
        </div>

        <!-- Result Container -->
        <div class="result-container">
            <div class="result-content">
                <div class="result-title">Quiz Complete! 🎉</div>
                <div class="badge" id="resultBadge"></div>
                <div class="badge-text" id="badgeText"></div>
                <div class="score-display" id="scoreDisplay"></div>
                <div class="result-details">
                    <div>
                        <span>⏱️ Time Taken:</span>
                        <span id="timeTaken"></span>
                    </div>
                    <div>
                        <span>📊 Score:</span>
                        <span id="finalScore"></span>
                    </div>
                    <div>
                        <span>📈 Level:</span>
                        <span id="levelCompleted"></span>
                    </div>
                </div>
                <button class="restart-button" onclick="retakeQuiz()">🔄 Retake Quiz</button>
                <button class="restart-button" onclick="showLevelSelection()">📚 Choose Different Level</button>
                <button class="restart-button" onclick="showChapterSelection()">📖 Choose Different Chapter</button>
            </div>
        </div>
    </div>

        function showScreen(screenClass) {
            document.querySelectorAll('.chapter-selection, .level-selection, .quiz-container, .result-container').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector(`.${screenClass}`).classList.add('active');
        }

        function startQuiz(level) {
            currentLevel = level;
            currentQuestionIndex = 0;
            score = 0;
            startTime = Date.now();

            // Shuffle questions
            const questions = [...questionBank[currentChapter][level]];
            shuffledQuestions = questions.sort(() => Math.random() - 0.5);

            showScreen('quiz-container');
            displayQuestion();
        }

        function displayQuestion() {
            answered = false;
            const question = shuffledQuestions[currentQuestionIndex];

            // Update progress
            document.getElementById('progressInfo').textContent = `${currentQuestionIndex}/10`;
            document.getElementById('progressFill').style.width = `${(currentQuestionIndex / 10) * 100}%`;

            let html = '';

            // Topic badge
            html += `<div class="topic-badge topic-${question.topic.toLowerCase()}">${question.topic}</div>`;

            // Question container
            html += `<div class="question-container">`;
            html += `<div class="question-emoji">${question.emoji}</div>`;
            html += `<div class="question-text">${question.question}</div>`;
            html += `</div>`;

            // Feedback message
            html += `<div class="feedback-message" id="feedbackMessage"></div>`;

            if (currentLevel === 'extreme') {
                // Text input for extreme level
                html += `<input type="text" class="extreme-input" id="extremeInput" placeholder="Type your answer here...">`;
                html += `<button class="show-answer-btn" onclick="showExtremeAnswer()">Show Answer</button>`;
                html += `<div class="extreme-answer" id="extremeAnswer"><strong>Answer:</strong> ${question.answer}</div>`;
                html += `<button class="next-button" onclick="nextQuestion()">Next Question →</button>`;
            } else {
                // Multiple choice answers
                html += `<div class="answers-container">`;
                question.options.forEach((option, index) => {
                    html += `<div class="answer-option" onclick="selectAnswer(${index})">${option}</div>`;
                });
                html += `</div>`;
                html += `<button class="next-button" id="nextBtn" onclick="nextQuestion()" disabled>Next Question →</button>`;
            }

            document.getElementById('quizContent').innerHTML = html;

            // Add floating background emojis
            addFloatingEmojis(question.emoji);
        }

        function selectAnswer(selectedIndex) {
            if (answered) return;

            answered = true;
            const question = shuffledQuestions[currentQuestionIndex];
            const options = document.querySelectorAll('.answer-option');
            const feedback = document.getElementById('feedbackMessage');
            const nextBtn = document.getElementById('nextBtn');

            options[selectedIndex].classList.add('selected');

            if (selectedIndex === question.correct) {
                options[selectedIndex].classList.add('correct');
                feedback.textContent = ['Excellent! 🌟', 'Perfect! ✨', 'Outstanding! 🎯', 'Brilliant! 💡', 'Superb! 🏆'][Math.floor(Math.random() * 5)];
                feedback.className = 'feedback-message feedback-correct';
                score++;
                createFallingEmojis('✅🎉⭐💫🌟');
            } else {
                options[selectedIndex].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                feedback.textContent = ['Try next 📚', 'Keep learning 📖', 'Review this topic 🔍', 'Study more 💪', 'Not quite ❌'][Math.floor(Math.random() * 5)];
                feedback.className = 'feedback-message feedback-incorrect';
                createFallingEmojis('❌📚🔍💭📖');
            }

            nextBtn.disabled = false;
        }

        function showExtremeAnswer() {
            document.getElementById('extremeAnswer').style.display = 'block';
        }

        function nextQuestion() {
            clearFallingEmojis();
            currentQuestionIndex++;

            if (currentQuestionIndex < 10) {
                displayQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const endTime = Date.now();
            const timeTaken = Math.floor((endTime - startTime) / 1000);
            const minutes = Math.floor(timeTaken / 60);
            const seconds = timeTaken % 60;

            let badge, badgeText, badgeEmoji;

            if (score >= 8) {
                badge = '🏆🥇';
                badgeText = 'Outstanding Performance!';
                badgeEmoji = '🎉🌟⭐✨💫🏆🥇👏';
            } else if (score >= 4) {
                badge = '🥈📚';
                badgeText = 'Good Effort!';
                badgeEmoji = '👍📚💪🎯📖✅😊';
            } else {
                badge = '🥉📝';
                badgeText = 'Keep Learning!';
                badgeEmoji = '📝📚💭🔍📖💡🌱';
            }

            document.getElementById('resultBadge').textContent = badge;
            document.getElementById('badgeText').textContent = badgeText;
            document.getElementById('scoreDisplay').textContent = `${score}/10`;
            document.getElementById('timeTaken').textContent = `${minutes}m ${seconds}s`;
            document.getElementById('finalScore').textContent = `${score}/10 (${score * 10}%)`;
            document.getElementById('levelCompleted').textContent = `${currentLevel.toUpperCase()} - Chapter ${currentChapter}`;

            showScreen('result-container');

            // Celebration emojis
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const emoji = badgeEmoji[Math.floor(Math.random() * badgeEmoji.length)];
                    createCelebrationEmoji(emoji);
                }, i * 100);
            }
        }

        function retakeQuiz() {
            startQuiz(currentLevel);
        }

        function createFallingEmojis(emojiString) {
            const emojis = emojiString.split('');
            const interval = setInterval(() => {
                if (answered && fallingEmojis.length < 50) {
                    const emoji = document.createElement('div');
                    emoji.className = 'falling-emoji';
                    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    emoji.style.left = Math.random() * 30 + '%';
                    emoji.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(emoji);
                    fallingEmojis.push(emoji);

                    setTimeout(() => {
                        emoji.remove();
                        fallingEmojis = fallingEmojis.filter(e => e !== emoji);
                    }, 5000);
                }
            }, 200);

            // Store interval to clear later
            window.fallingInterval = interval;
        }

        function clearFallingEmojis() {
            clearInterval(window.fallingInterval);
            fallingEmojis.forEach(emoji => emoji.remove());
            fallingEmojis = [];
        }

        function createCelebrationEmoji(emoji) {
            const elem = document.createElement('div');
            elem.className = 'celebration-emoji';
            elem.textContent = emoji;
            elem.style.left = Math.random() * 90 + '%';
            document.body.appendChild(elem);

            setTimeout(() => elem.remove(), 3000);
        }

        function addFloatingEmojis(emoji) {
            // Remove old floating emojis
            document.querySelectorAll('.floating-bg-emoji').forEach(e => e.remove());

            // Add new floating emojis
            const emojis = emoji.split('');
            for (let i = 0; i < 5; i++) {
                const elem = document.createElement('div');
                elem.className = 'floating-bg-emoji';
                elem.textContent = emojis[i % emojis.length];
                elem.style.left = Math.random() * 100 + '%';
                elem.style.top = Math.random() * 100 + '%';
                elem.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(elem);
            }
        }

        // Initialize on load
        window.onload = initializeChapters;
    </script>
</body>
</html>
