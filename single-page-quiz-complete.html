<style>
/* Minimal CSS for Quiz */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.main-container {
    max-width: 900px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: white;
    padding: 30px;
    font-size: 2.5em;
}

.screen {
    display: none;
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.3);
}

.screen.active { display: block; }

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
    font-size: 2em;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin: 30px 0;
}

.card {
    padding: 30px 20px;
    border-radius: 15px;
    text-align: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 1.2em;
    transition: transform 0.3s;
    color: white;
    border: none;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.level-easy { background: linear-gradient(135deg, #667eea, #764ba2); }
.level-medium { background: linear-gradient(135deg, #f093fb, #f5576c); }
.level-hard { background: linear-gradient(135deg, #4facfe, #00f2fe); }
.level-expert { background: linear-gradient(135deg, #43e97b, #38f9d7); }
.level-extreme { background: linear-gradient(135deg, #fa709a, #fee140); }

.progress {
    background: #f0f0f0;
    border-radius: 10px;
    height: 30px;
    margin-bottom: 30px;
    position: relative;
    overflow: hidden;
}

.progress-bar {
    background: linear-gradient(90deg, #667eea, #764ba2);
    height: 100%;
    width: 10%;
    transition: width 0.3s;
}

.progress-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-weight: bold;
    color: #333;
    font-size: 0.9em;
}

.question {
    font-size: 1.4em;
    color: #333;
    margin: 30px 0;
    line-height: 1.6;
    font-weight: 500;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.option {
    padding: 20px;
    border: 3px solid #ddd;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    background: white;
    text-align: left;
    font-size: 1.1em;
}

.option:hover {
    border-color: #667eea;
    background: #f8f9ff;
    transform: translateX(5px);
}

.option.correct {
    background: #d4edda;
    border-color: #28a745;
}

.option.incorrect {
    background: #f8d7da;
    border-color: #dc3545;
}

.feedback {
    margin: 25px 0;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    font-size: 1.3em;
}

.feedback.correct {
    background: #d4edda;
    color: #155724;
}

.feedback.incorrect {
    background: #f8d7da;
    color: #721c24;
}

.btn {
    padding: 15px 40px;
    border: none;
    border-radius: 12px;
    font-size: 1.1em;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s;
    margin: 10px;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

.btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.btn-secondary {
    background: #6c757d;
    color: white;
}

.btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.btn-group {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 30px;
}

.result {
    text-align: center;
}

.score {
    font-size: 5em;
    font-weight: bold;
    color: #667eea;
    margin: 30px 0;
}

.back-btn {
    display: block;
    margin: 30px auto 0;
}

@media (max-width: 768px) {
    h1 { font-size: 1.8em; padding: 20px; }
    h2 { font-size: 1.5em; }
    .screen { padding: 20px; }
    .question { font-size: 1.1em; }
    .score { font-size: 3em; }
}
</style>

<div class="main-container">
    <h1>🔬 Science Quiz 🔬</h1>

    <!-- Chapter Selection -->
    <div id="chapterScreen" class="screen active">
        <h2>Select Chapter</h2>
        <div class="grid" id="chapterGrid"></div>
        <button class="btn btn-secondary back-btn" onclick="goHome()">⬅️ Back to Home</button>
    </div>

    <!-- Level Selection -->
    <div id="levelScreen" class="screen">
        <h2 id="levelTitle">Select Difficulty Level</h2>
        <div class="grid">
            <button class="card level-easy" onclick="startQuiz('easy')">
                😊<br><br>Easy
            </button>
            <button class="card level-medium" onclick="startQuiz('medium')">
                🤔<br><br>Medium
            </button>
            <button class="card level-hard" onclick="startQuiz('hard')">
                😰<br><br>Hard
            </button>
            <button class="card level-expert" onclick="startQuiz('expert')">
                🧠<br><br>Expert
            </button>
            <button class="card level-extreme" onclick="startQuiz('extreme')">
                🔥<br><br>Extreme
            </button>
        </div>
        <button class="btn btn-secondary back-btn" onclick="showChapters()">⬅️ Back to Chapters</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="screen">
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">Question 1 of 10</div>
        </div>

        <div class="question" id="questionText"></div>
        <div class="options" id="answerOptions"></div>
        <div id="feedback" class="feedback" style="display:none;"></div>

        <div class="btn-group">
            <button id="nextBtn" class="btn btn-primary" onclick="nextQuestion()" disabled>
                Next Question ➡️
            </button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="screen">
        <h2>🎉 Quiz Complete! 🎉</h2>
        <div class="result">
            <div class="score" id="scoreNumber">0</div>
            <p style="font-size: 1.5em; color: #666; margin-bottom: 30px;">out of 10 questions</p>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="retryQuiz()">🔄 Try Again</button>
                <button class="btn btn-secondary" onclick="goHome()">🏠 Home</button>
            </div>
        </div>
    </div>
</div>

<script>
// ===== SCIENCE QUESTIONS DATA =====
const scienceQuestions = {
    1: {
        easy: [
            { question: "What is H2O?", options: ["Water", "Hydrogen", "Oxygen", "Salt"], correct: 0 },
            { question: "What planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], correct: 1 },
            { question: "What gas do plants use for photosynthesis?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: 2 },
            { question: "What is the center of an atom called?", options: ["Electron", "Proton", "Nucleus", "Neutron"], correct: 2 },
            { question: "At what temperature does water boil?", options: ["50°C", "75°C", "100°C", "125°C"], correct: 2 },
            { question: "What is the largest organ in the human body?", options: ["Heart", "Liver", "Skin", "Brain"], correct: 2 },
            { question: "How many bones are in the adult human body?", options: ["186", "206", "226", "246"], correct: 1 },
            { question: "What is the speed of light?", options: ["300,000 km/s", "150,000 km/s", "450,000 km/s", "600,000 km/s"], correct: 0 },
            { question: "What is photosynthesis?", options: ["Animal breathing", "Plant making food", "Water cycle", "Rock formation"], correct: 1 },
            { question: "What is the smallest unit of life?", options: ["Atom", "Molecule", "Cell", "Organ"], correct: 2 }
        ],
        medium: [
            { question: "What is the chemical formula for table salt?", options: ["NaCl", "KCl", "CaCl2", "MgCl2"], correct: 0 },
            { question: "Which vitamin is produced when skin is exposed to sunlight?", options: ["Vitamin A", "Vitamin B", "Vitamin C", "Vitamin D"], correct: 3 },
            { question: "What is the powerhouse of the cell?", options: ["Nucleus", "Ribosome", "Mitochondria", "Chloroplast"], correct: 2 },
            { question: "How many chambers does the human heart have?", options: ["2", "3", "4", "5"], correct: 2 },
            { question: "What is the pH of pure water?", options: ["5", "6", "7", "8"], correct: 2 },
            { question: "What gas makes up most of Earth's atmosphere?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Argon"], correct: 2 },
            { question: "What type of animal is a dolphin?", options: ["Fish", "Mammal", "Reptile", "Amphibian"], correct: 1 },
            { question: "How many planets are in our solar system?", options: ["7", "8", "9", "10"], correct: 1 },
            { question: "What is the hardest natural substance on Earth?", options: ["Gold", "Iron", "Diamond", "Steel"], correct: 2 },
            { question: "What process turns liquid water into vapor?", options: ["Condensation", "Evaporation", "Precipitation", "Sublimation"], correct: 1 }
        ],
        hard: [
            { question: "What is Newton's second law of motion?", options: ["F=ma", "E=mc²", "V=IR", "PV=nRT"], correct: 0 },
            { question: "What is the atomic number of carbon?", options: ["4", "6", "8", "12"], correct: 1 },
            { question: "Which organelle contains DNA?", options: ["Ribosome", "Nucleus", "Golgi apparatus", "Lysosome"], correct: 1 },
            { question: "What is the unit of electrical resistance?", options: ["Volt", "Ampere", "Ohm", "Watt"], correct: 2 },
            { question: "What is the chemical symbol for gold?", options: ["Go", "Gd", "Au", "Ag"], correct: 2 },
            { question: "How long does it take light from the Sun to reach Earth?", options: ["5 minutes", "8 minutes", "12 minutes", "15 minutes"], correct: 1 },
            { question: "What is the chemical formula for glucose?", options: ["C6H12O6", "C12H22O11", "CH4", "CO2"], correct: 0 },
            { question: "What is the name of the first element on the periodic table?", options: ["Helium", "Oxygen", "Hydrogen", "Carbon"], correct: 2 },
            { question: "What is the most abundant element in the universe?", options: ["Oxygen", "Carbon", "Helium", "Hydrogen"], correct: 3 },
            { question: "What type of bond holds water molecules together?", options: ["Ionic", "Covalent", "Hydrogen", "Metallic"], correct: 2 }
        ]
    },
    2: {
        easy: [
            { question: "What color is the sky on a clear day?", options: ["Red", "Blue", "Green", "Yellow"], correct: 1 },
            { question: "How many legs does a spider have?", options: ["6", "8", "10", "12"], correct: 1 },
            { question: "What do bees make?", options: ["Milk", "Honey", "Butter", "Cheese"], correct: 1 },
            { question: "What is the largest mammal?", options: ["Elephant", "Giraffe", "Blue Whale", "Shark"], correct: 2 },
            { question: "What do plants need to grow?", options: ["Only water", "Only sunlight", "Water and sunlight", "Only soil"], correct: 2 },
            { question: "What is ice made of?", options: ["Salt", "Sugar", "Water", "Air"], correct: 2 },
            { question: "What season comes after winter?", options: ["Summer", "Fall", "Spring", "Autumn"], correct: 2 },
            { question: "What do we use to see?", options: ["Ears", "Eyes", "Nose", "Mouth"], correct: 1 },
            { question: "How many days are in a week?", options: ["5", "6", "7", "8"], correct: 2 },
            { question: "What animal says 'meow'?", options: ["Dog", "Cat", "Cow", "Bird"], correct: 1 }
        ],
        medium: [
            { question: "What is the largest planet in our solar system?", options: ["Earth", "Mars", "Jupiter", "Saturn"], correct: 2 },
            { question: "What is the freezing point of water in Celsius?", options: ["-10°C", "0°C", "10°C", "32°C"], correct: 1 },
            { question: "What part of the plant conducts photosynthesis?", options: ["Root", "Stem", "Leaf", "Flower"], correct: 2 },
            { question: "What is the nearest star to Earth?", options: ["Alpha Centauri", "Sirius", "Polaris", "The Sun"], correct: 3 },
            { question: "How many teeth does an adult human have?", options: ["28", "30", "32", "34"], correct: 2 },
            { question: "What is the main gas in the air we breathe?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: 1 },
            { question: "What is the process by which plants make food?", options: ["Respiration", "Photosynthesis", "Digestion", "Fermentation"], correct: 1 },
            { question: "What is the largest ocean on Earth?", options: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: 3 },
            { question: "What metal is liquid at room temperature?", options: ["Iron", "Gold", "Mercury", "Silver"], correct: 2 },
            { question: "How many continents are there?", options: ["5", "6", "7", "8"], correct: 2 }
        ]
    },
    3: {
        easy: [
            { question: "What shape is a ball?", options: ["Square", "Triangle", "Circle", "Rectangle"], correct: 2 },
            { question: "What color are bananas?", options: ["Red", "Blue", "Yellow", "Green"], correct: 2 },
            { question: "How many wheels does a bicycle have?", options: ["1", "2", "3", "4"], correct: 1 },
            { question: "What do fish use to breathe?", options: ["Lungs", "Gills", "Skin", "Nose"], correct: 1 },
            { question: "What is the opposite of hot?", options: ["Warm", "Cool", "Cold", "Freezing"], correct: 2 },
            { question: "How many fingers do you have on one hand?", options: ["4", "5", "6", "10"], correct: 1 },
            { question: "What do birds use to fly?", options: ["Legs", "Wings", "Tail", "Beak"], correct: 1 },
            { question: "What comes after Monday?", options: ["Sunday", "Tuesday", "Wednesday", "Thursday"], correct: 1 },
            { question: "What do we drink when we're thirsty?", options: ["Sand", "Water", "Rock", "Air"], correct: 1 },
            { question: "What animal barks?", options: ["Cat", "Dog", "Cow", "Pig"], correct: 1 }
        ]
    }
};

// ===== QUIZ LOGIC =====
let currentChapter = 1;
let currentLevel = '';
let currentQuestionIndex = 0;
let score = 0;
let questions = [];
let answered = false;

// Initialize
window.onload = function() {
    showChapters();
};

function showChapters() {
    hideAll();
    document.getElementById('chapterScreen').classList.add('active');

    const grid = document.getElementById('chapterGrid');
    grid.innerHTML = '';

    // Generate 3 chapters
    for (let i = 1; i <= 3; i++) {
        const btn = document.createElement('button');
        btn.className = 'card level-easy';
        btn.innerHTML = `📖<br><br>Chapter ${i}`;
        btn.onclick = () => selectChapter(i);
        grid.appendChild(btn);
    }
}

function selectChapter(chapter) {
    currentChapter = chapter;
    hideAll();
    document.getElementById('levelScreen').classList.add('active');
    document.getElementById('levelTitle').textContent = `Chapter ${chapter} - Select Level`;
}

function startQuiz(level) {
    currentLevel = level;
    currentQuestionIndex = 0;
    score = 0;
    answered = false;

    // Get questions for this chapter and level
    if (scienceQuestions[currentChapter] && scienceQuestions[currentChapter][level]) {
        questions = [...scienceQuestions[currentChapter][level]];
    } else {
        alert(`Sorry! Questions for Chapter ${currentChapter} - ${level} level are not available yet. Please try another chapter or level.`);
        return;
    }

    hideAll();
    document.getElementById('quizScreen').classList.add('active');
    displayQuestion();
}

function displayQuestion() {
    if (currentQuestionIndex >= questions.length) {
        showResults();
        return;
    }

    answered = false;
    const question = questions[currentQuestionIndex];

    // Update progress
    const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
    document.getElementById('progressBar').style.width = progress + '%';
    document.getElementById('progressText').textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;

    // Display question
    document.getElementById('questionText').textContent = question.question;

    // Display options
    const optionsDiv = document.getElementById('answerOptions');
    optionsDiv.innerHTML = '';

    question.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = option;
        btn.onclick = () => selectAnswer(index);
        optionsDiv.appendChild(btn);
    });

    // Reset feedback and button
    const feedback = document.getElementById('feedback');
    feedback.style.display = 'none';
    feedback.textContent = '';
    feedback.className = 'feedback';
    document.getElementById('nextBtn').disabled = true;
}

function selectAnswer(selectedIndex) {
    if (answered) return;

    answered = true;
    const question = questions[currentQuestionIndex];
    const options = document.querySelectorAll('.option');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');

    if (selectedIndex === question.correct) {
        options[selectedIndex].classList.add('correct');
        feedback.textContent = '✅ Correct! Well done! 🌟';
        feedback.className = 'feedback correct';
        score++;
    } else {
        options[selectedIndex].classList.add('incorrect');
        options[question.correct].classList.add('correct');
        feedback.textContent = '❌ Incorrect. The correct answer is highlighted.';
        feedback.className = 'feedback incorrect';
    }

    feedback.style.display = 'block';
    nextBtn.disabled = false;
}

function nextQuestion() {
    currentQuestionIndex++;
    displayQuestion();
}

function showResults() {
    hideAll();
    document.getElementById('resultScreen').classList.add('active');
    document.getElementById('scoreNumber').textContent = score;
}

function retryQuiz() {
    startQuiz(currentLevel);
}

function goHome() {
    window.location.href = '/';
}

function hideAll() {
    document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
    });
}
</script>
