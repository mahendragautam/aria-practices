<style>
/* ========================================
   404 PAGE - FULL SCREEN COVERAGE
   All inline CSS for complete control
   ======================================== */

/* Remove all WordPress container constraints */
body.error404,
body.error404 .wp-site-blocks,
body.error404 main,
body.error404 .wp-block-group,
body.error404 .entry-content,
body.error404 article {
    padding: 0 !important;
    margin: 0 !important;
    max-width: 100% !important;
}

/* 404 Page Container - Full Width Body Section Only */
.error-404-page {
    display: flex !important;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100vw !important;
    min-height: calc(100vh - 200px) !important;
    margin: 0 !important;
    margin-left: calc(50% - 50vw) !important;
    margin-right: calc(50% - 50vw) !important;
    padding: 60px 0 !important;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    overflow-x: hidden;
    box-sizing: border-box !important;
}

/* Container for content */
.error-404-container {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    position: relative;
    z-index: 2;
    padding: 40px 20px;
    box-sizing: border-box;
}

/* White content card */
.error-404-content {
    background: rgba(255, 255, 255, 0.98);
    border-radius: 30px;
    padding: 60px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: fadeInUp 0.8s ease-out;
    position: relative;
    overflow: hidden;
}

/* Search emoji */
.error-404-emoji {
    font-size: 5em;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
    position: relative;
    z-index: 10;
}

/* 404 Title */
.error-404-title {
    font-size: 8em;
    font-weight: 900;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
    line-height: 1;
    animation: glowPulse 2s ease-in-out infinite;
    position: relative;
    z-index: 10;
}

/* Subtitle */
.error-404-subtitle {
    font-size: 2.5em;
    color: #333;
    margin: 20px 0;
    font-weight: bold;
    position: relative;
    z-index: 10;
}

/* Description */
.error-404-description {
    font-size: 1.2em;
    color: #666;
    margin: 30px 0;
    line-height: 1.6;
    position: relative;
    z-index: 10;
}

/* Buttons container */
.error-404-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin: 40px 0;
    flex-wrap: wrap;
    position: relative;
    z-index: 10;
}

/* Button base styles */
.error-404-btn {
    padding: 18px 40px;
    border-radius: 50px;
    font-size: 1.1em;
    font-weight: bold;
    text-decoration: none;
    transition: all 0.3s ease;
    display: inline-block;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

/* Primary button */
.error-404-btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.error-404-btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}

/* Secondary button */
.error-404-btn-secondary {
    background: white;
    color: #667eea;
    border: 3px solid #667eea;
}

.error-404-btn-secondary:hover {
    background: #667eea;
    color: white;
    transform: translateY(-3px);
}

/* Suggestions section */
.error-404-suggestions {
    margin-top: 50px;
    padding-top: 30px;
    border-top: 2px solid #eee;
    position: relative;
    z-index: 10;
}

.error-404-suggestions h3 {
    font-size: 1.5em;
    color: #333;
    margin-bottom: 20px;
}

/* Links container */
.error-404-links {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

/* Individual links */
.error-404-link {
    padding: 12px 25px;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
    border-radius: 25px;
    color: #667eea;
    text-decoration: none;
    font-weight: bold;
    transition: all 0.3s ease;
    border: 2px solid transparent;
}

.error-404-link:hover {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

/* Floating emoji background - INSIDE content card */
.error-404-bg-emojis {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

/* Floating emojis */
.floating-emoji {
    position: absolute;
    font-size: 4em;
    opacity: 0.08;
    animation: floatAround 8s ease-in-out infinite;
}

.floating-emoji:nth-child(1) {
    top: 5%;
    left: 5%;
    animation-delay: 0s;
}

.floating-emoji:nth-child(2) {
    top: 15%;
    right: 8%;
    animation-delay: 1.5s;
}

.floating-emoji:nth-child(3) {
    top: 40%;
    left: 10%;
    animation-delay: 3s;
}

.floating-emoji:nth-child(4) {
    top: 65%;
    right: 12%;
    animation-delay: 2s;
}

.floating-emoji:nth-child(5) {
    bottom: 10%;
    left: 50%;
    animation-delay: 4s;
}

.floating-emoji:nth-child(6) {
    top: 30%;
    right: 25%;
    animation-delay: 2.5s;
}

.floating-emoji:nth-child(7) {
    bottom: 30%;
    left: 20%;
    animation-delay: 1s;
}

.floating-emoji:nth-child(8) {
    top: 50%;
    left: 35%;
    animation-delay: 3.5s;
}

/* Animations */
@keyframes fadeInUp {
    0% {
        opacity: 0;
        transform: translateY(50px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    25% {
        transform: translateY(-20px) rotate(-5deg);
    }
    75% {
        transform: translateY(-10px) rotate(5deg);
    }
}

@keyframes glowPulse {
    0%, 100% {
        filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.5));
    }
    50% {
        filter: drop-shadow(0 0 40px rgba(118, 75, 162, 0.8));
    }
}

@keyframes floatAround {
    0%, 100% {
        transform: translate(0, 0) rotate(0deg);
    }
    25% {
        transform: translate(20px, -20px) rotate(5deg);
    }
    50% {
        transform: translate(-15px, 15px) rotate(-5deg);
    }
    75% {
        transform: translate(15px, -10px) rotate(3deg);
    }
}

/* ========================================
   RESPONSIVE DESIGN - ALL DEVICES
   ======================================== */

/* Tablets and smaller devices */
@media (max-width: 1024px) {
    .error-404-container {
        padding: 30px 15px;
    }

    .error-404-content {
        padding: 40px 25px;
    }

    .error-404-title {
        font-size: 6em;
    }

    .error-404-subtitle {
        font-size: 2em;
    }

    .floating-emoji {
        font-size: 3em;
    }
}

/* Mobile devices */
@media (max-width: 768px) {
    .error-404-page {
        min-height: 100vh !important;
        padding: 20px 0 !important;
    }

    .error-404-container {
        width: 100%;
        padding: 20px 10px;
    }

    .error-404-content {
        padding: 30px 20px;
        border-radius: 20px;
    }

    .error-404-emoji {
        font-size: 3em;
    }

    .error-404-title {
        font-size: 4em;
    }

    .error-404-subtitle {
        font-size: 1.5em;
    }

    .error-404-description {
        font-size: 1em;
        padding: 0 5px;
    }

    .error-404-buttons {
        flex-direction: column;
        gap: 12px;
        width: 100%;
    }

    .error-404-btn {
        width: 100%;
        padding: 15px 20px;
        font-size: 1em;
    }

    .error-404-suggestions {
        margin-top: 30px;
        padding: 20px 0 0;
    }

    .error-404-suggestions h3 {
        font-size: 1.2em;
    }

    .error-404-links {
        flex-direction: column;
        gap: 10px;
        width: 100%;
    }

    .error-404-link {
        width: 100%;
        margin: 0;
    }

    .floating-emoji {
        font-size: 2.5em;
    }
}

/* Small mobile devices */
@media (max-width: 480px) {
    .error-404-title {
        font-size: 3em;
    }

    .error-404-subtitle {
        font-size: 1.3em;
    }

    .error-404-emoji {
        font-size: 2.5em;
    }

    .error-404-content {
        padding: 25px 15px;
    }

    .floating-emoji {
        font-size: 2em;
    }
}
</style>
