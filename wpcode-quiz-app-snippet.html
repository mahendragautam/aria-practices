<!-- Load Quiz CSS -->
<link rel="stylesheet" href="[UPLOAD quiz.css TO WPCODE AND GET URL]">

<!-- Bubble Background -->
<div class="bubble-container">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<!-- Main Quiz Container -->
<div class="main-container">

    <!-- Quiz Header -->
    <div class="quiz-header">
        <h1>🎓 Quiz Master</h1>
        <a href="/" class="home-link">🏠 Home</a>
    </div>

    <!-- All Quiz Screens -->
    <div class="home-page active">

        <!-- Chapter Selection Screen -->
        <div class="chapter-selection">
            <h2 id="subjectTitle">Select Subject</h2>
            <div class="chapter-grid" id="chapterGrid">
                <!-- Chapters populated by JS -->
            </div>
            <button class="back-btn" onclick="showHomePage()">⬅️ Back to Home</button>
        </div>

        <!-- Level Selection Screen -->
        <div class="level-selection">
            <h2 id="levelTitle">Select Difficulty Level</h2>
            <div class="level-grid" id="levelGrid">
                <button class="level-card level-easy" onclick="startQuiz('easy')">
                    <div class="level-emoji">😊</div>
                    <div>Easy</div>
                </button>
                <button class="level-card level-medium" onclick="startQuiz('medium')">
                    <div class="level-emoji">🤔</div>
                    <div>Medium</div>
                </button>
                <button class="level-card level-hard" onclick="startQuiz('hard')">
                    <div class="level-emoji">😰</div>
                    <div>Hard</div>
                </button>
                <button class="level-card level-expert" onclick="startQuiz('expert')">
                    <div class="level-emoji">🧠</div>
                    <div>Expert</div>
                </button>
                <button class="level-card level-extreme" onclick="startQuiz('extreme')">
                    <div class="level-emoji">🔥</div>
                    <div>Extreme</div>
                </button>
            </div>
            <button class="back-btn" onclick="showChapterSelection()">⬅️ Back to Chapters</button>
        </div>

        <!-- Quiz Container -->
        <div class="quiz-container">
            <!-- Quiz Header (Subject Title with Emoji) -->
            <div class="quiz-header-section">
                <h2 id="quizSubjectTitle"></h2>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text" id="progressText">Question 1 of 10</div>
            </div>

            <!-- Timer (for timed mode) -->
            <div class="timer-container" id="timerContainer" style="display: none;">
                <div class="timer-icon">⏱️</div>
                <div class="timer-display" id="timerDisplay">0:00</div>
            </div>

            <!-- Question Card -->
            <div class="question-card">
                <h3 class="question-text" id="questionText"></h3>

                <!-- Answer Options Container -->
                <div class="answer-options" id="answerOptions">
                    <!-- Options populated by JS -->
                </div>

                <!-- Extreme Level Input (for text answers) -->
                <div class="extreme-input-container" id="extremeInputContainer" style="display: none;">
                    <input type="text" id="extremeInput" class="extreme-input" placeholder="Type your answer here...">
                    <button id="submitBtn" class="submit-answer-btn" onclick="submitExtremeAnswer()">Submit Answer</button>
                    <button class="show-answer-btn" onclick="showExtremeAnswer()">Show Answer</button>
                    <div id="extremeAnswer" class="extreme-answer" style="display: none;">
                        <strong>Correct Answer:</strong> <span id="correctAnswer"></span>
                    </div>
                </div>

                <!-- Feedback Message -->
                <div id="feedbackMessage" class="feedback-message"></div>

                <!-- Navigation Buttons -->
                <div class="quiz-nav-buttons">
                    <button id="prevBtn" class="nav-btn prev-btn" onclick="previousQuestion()" disabled>⬅️ Previous</button>
                    <button id="nextBtn" class="nav-btn next-btn" onclick="nextQuestion()" disabled>Next ➡️</button>
                </div>
            </div>

            <!-- Pause Button (for normal mode) -->
            <div class="pause-container" id="pauseContainer">
                <button class="pause-btn" id="pauseBtn" onclick="pauseQuiz()">⏸️ Pause</button>
            </div>
        </div>

        <!-- Result Container -->
        <div class="result-container">
            <div class="result-card">
                <h2 class="result-title" id="resultTitle"></h2>
                <div class="result-emoji" id="resultEmoji"></div>

                <div class="score-display">
                    <div class="score-number" id="scoreNumber"></div>
                    <div class="score-label">out of 10</div>
                </div>

                <div class="result-stats">
                    <div class="stat-item">
                        <div class="stat-label">Time Taken</div>
                        <div class="stat-value" id="timeTaken"></div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Accuracy</div>
                        <div class="stat-value" id="accuracy"></div>
                    </div>
                </div>

                <div class="result-buttons">
                    <button class="result-btn retry-btn" onclick="retryQuiz()">🔄 Try Again</button>
                    <button class="result-btn home-btn" onclick="showHomePage()">🏠 Home</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Quiz Footer -->
    <div class="quiz-footer">
        <p>© 2024 Quiz Master | <a href="https://quiz.smartfamilypicks.com">Smart Family Picks</a></p>
    </div>

</div>

<!-- Load Quiz JavaScript -->
<script src="[UPLOAD quiz-master-app.js TO WPCODE AND GET URL]"></script>
